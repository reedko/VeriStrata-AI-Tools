# This file is included from Nginx's `http` context on the supported VPS
# profile, so shared request zones can be declared here.
limit_req_zone $binary_remote_addr zone=ai_tools_public_per_ip:10m rate=120r/m;
limit_req_zone $binary_remote_addr zone=ai_tools_api_per_ip:10m rate=30r/m;

server {
    listen 80;
    listen [::]:80;
    server_name tools.veristrata.ai;

    root /opt/VeriStrata-AI-Tools/apps/tools-lab/dist/client;
    index index.html;

    client_max_body_size 1m;
    limit_req_status 429;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /swagger/ {
        limit_req zone=ai_tools_public_per_ip burst=30 nodelay;
        proxy_pass http://127.0.0.1:8791;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /api/health {
        limit_req zone=ai_tools_public_per_ip burst=30 nodelay;
        proxy_pass http://127.0.0.1:8791;
        proxy_set_header Host $host;
    }

    location = /api/tools {
        limit_req zone=ai_tools_public_per_ip burst=30 nodelay;
        proxy_pass http://127.0.0.1:8791;
        proxy_set_header Host $host;
    }

    location /api/ {
        # This protects the key-validation and database layer even when a
        # caller supplies an invalid or missing client credential.
        limit_req zone=ai_tools_api_per_ip burst=10 nodelay;
        proxy_pass http://127.0.0.1:8791;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
