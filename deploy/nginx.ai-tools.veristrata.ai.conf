server {
    listen 80;
    listen [::]:80;
    server_name ai-tools.veristrata.ai;

    root /opt/VeriStrata-AI-Tools/apps/tools-lab/dist/client;
    index index.html;

    client_max_body_size 1m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /swagger/ {
        proxy_pass http://127.0.0.1:8791;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /api/health {
        proxy_pass http://127.0.0.1:8791;
        proxy_set_header Host $host;
    }

    location = /api/tools {
        proxy_pass http://127.0.0.1:8791;
        proxy_set_header Host $host;
    }

    location = /api/evaluations/corpus-preflight {
        limit_except POST { deny all; }
        proxy_pass http://127.0.0.1:8791;
        proxy_set_header Host $host;
    }

    # Privileged endpoints stay unavailable on the public preview. Replace
    # these rules with an authenticated location only after access control is configured.
    location /api/partner/ { return 403; }
    location ~ ^/api/tools/[^/]+/execute$ { return 403; }
    location /api/assessments/ { return 403; }
    location = /api/diagnostics { return 403; }
}
