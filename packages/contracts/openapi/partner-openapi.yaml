openapi: 3.1.0
info:
  title: VeriStrata Partner API
  version: 1.0.0-pilot
  summary: Evidence-backed deliberation APIs for partner application integrations.
  description: |
    ## Start here

    This API is independent of the frontend. React, dynamic HTML, server
    applications, and agents can all use the same JSON endpoints.

    ### 1. Get a test API key

    Sign in to the VeriStrata dashboard, then open
    <a href="https://veristrata.ai/account?open=partner-api-docs" target="_blank" rel="noopener noreferrer"><strong>VeriStrata Account → API</strong></a>.
    Choose **Generate API key**,
    select a 90- or 365-day expiration, and copy the complete `vsk_...` value
    immediately. It is shown only once. A super administrator can instead open
    `/admin/system` and use **External API Keys** to issue one for a specific
    user's email address.

    ### 2. Authorize this page

    Choose **Authorize** above and paste only the complete `vsk_...` key. Do not
    type `Bearer`; Swagger adds it. Authorization is not persisted after the
    browser session. The key determines which topics and evidence are visible.

    ### 3. Run the demo in this order

    1. **POST `/topics`** — create a topic. Copy `data.topic_id`.
    2. **POST `/topics/{topicId}/prepare`** — paste that ID and start framing.
       Copy `data.job_id`.
    3. **GET `/topics/{topicId}/jobs/{jobId}`** — poll until `data.status` is
       `completed` or `failed`.
    4. **GET `/topics/{topicId}/review-workspace`** — read proposed hypotheses.
    5. **POST `/topics/{topicId}/evidence-start`** — submit selected hypothesis
       IDs and text. Wait for their evidence runs to finish.
    6. **GET `/topics/{topicId}/evidence-review`** — get balanced featured
       support, refute, and qualifying relationships.
    7. **POST `/topics/{topicId}/evidence-relationships/{relationshipId}/review`**
       — approve, revise and approve, or reject each featured relationship.
    8. **POST `/topics/{topicId}/review-finish`** — publish approved evidence.
    9. **GET `/topics/{topicId}/panel`** — load the frontend-neutral result.
    10. Optionally read `/verimeter`, claim `/evidence`, `/handoff`, or submit a
        pending `/contributions` item.

    A field such as `topicId`, `jobId`, `relationshipId`, or `claimId` is not an
    arbitrary value. Copy it from the response produced by the preceding step.

    ### Security and response format

    Never embed a long-lived key in public browser JavaScript. Partner applications
    should keep it in their backend or a narrow same-origin proxy. Success responses
    use `{ "data": ... }`; errors use
    `{ "error": { "code": "...", "message": "..." } }`.
  contact:
    name: VeriStrata API support
  license:
    name: VeriStrata Partner API contract notice (proprietary)
servers:
  - url: /api/v1
    description: VeriStrata production API
tags:
  - { name: Topics, description: Create and inspect owner-scoped topics. }
  - { name: Preparation, description: Frame claims and monitor preparation. }
  - { name: Evidence, description: Start, rank, inspect, and review evidence. }
  - { name: Publication, description: Publish and retrieve immutable releases. }
  - { name: Integration, description: Frontend-neutral read models and handoff data. }
  - { name: Discussion, description: Submit pending analysis for moderation. }
security:
  - bearerApiKey: []

components:
  securitySchemes:
    bearerApiKey:
      type: http
      scheme: bearer
      bearerFormat: vsk
      description: Server-held VeriStrata API key beginning with `vsk_`.
  parameters:
    TopicId:
      name: topicId
      in: path
      required: true
      description: Copy `data.topic_id` from `POST /topics`; do not invent this value.
      schema: { type: string, format: uuid }
    JobId:
      name: jobId
      in: path
      required: true
      description: Copy `data.job_id` from `POST /topics/{topicId}/prepare`.
      schema: { type: string, format: uuid }
    ReleaseId:
      name: releaseId
      in: path
      required: true
      description: Copy `data.release_id` from a publication or release-list response.
      schema: { type: string, format: uuid }
    ClaimId:
      name: claimId
      in: path
      required: true
      description: Copy a numeric `claim_id` from the panel, claims, or evidence-review response.
      schema: { type: integer, minimum: 1 }
    RelationshipId:
      name: relationshipId
      in: path
      required: true
      description: Copy `relationship_id` from the evidence-review response.
      schema: { type: integer, minimum: 1 }
  responses:
    BadRequest:
      description: Request validation failed.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Unauthorized:
      description: Bearer key missing, invalid, expired, or disabled.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    NotFound:
      description: Resource absent or not visible to the key owner.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Conflict:
      description: Operation conflicts with the current topic state.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    ServerError:
      description: Operation failed unexpectedly.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
  schemas:
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: true
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            details: { type: object, additionalProperties: true }
    TopicState:
      type: string
      enum: [created, preparing, in_review, published, failed]
    Topic:
      type: object
      additionalProperties: false
      required: [topic_id, title, state, snapshot_version, created_at, updated_at, links]
      properties:
        topic_id: { type: string, format: uuid }
        title: { type: string }
        description: { type: [string, 'null'] }
        partner_external_id: { type: [string, 'null'] }
        location_label: { type: [string, 'null'] }
        state: { $ref: '#/components/schemas/TopicState' }
        inquiry_case_id: { type: [string, 'null'] }
        case_id: { type: [integer, 'null'] }
        snapshot_version: { type: integer, minimum: 1 }
        created_at: { type: [string, 'null'], format: date-time }
        updated_at: { type: [string, 'null'], format: date-time }
        links:
          type: object
          additionalProperties: false
          required: [self, prepare, review_workspace, evidence_review, finish_review, releases, panel, handoff]
          properties:
            self: { type: string }
            prepare: { type: string }
            review_workspace: { type: string }
            evidence_review: { type: string }
            finish_review: { type: string }
            releases: { type: string }
            panel: { type: string }
            handoff: { type: string }
    SourceInput:
      description: Exactly one of `url`, `text`, or `content_id` is required.
      oneOf:
        - type: object
          additionalProperties: false
          required: [url]
          properties: { url: { type: string, format: uri, minLength: 8, maxLength: 2048 } }
        - type: object
          additionalProperties: false
          required: [text]
          properties: { text: { type: string, minLength: 10, maxLength: 20000 } }
        - type: object
          additionalProperties: false
          required: [content_id]
          properties: { content_id: { type: integer, minimum: 1 } }
    TopicCreateRequest:
      type: object
      additionalProperties: false
      required: [title]
      properties:
        title: { type: string, minLength: 5, maxLength: 255 }
        description: { type: [string, 'null'], maxLength: 4000 }
        partner_external_id:
          type: [string, 'null']
          maxLength: 255
          description: Caller-owned idempotency identifier.
        location_label: { type: [string, 'null'], maxLength: 255 }
        seed_sources:
          type: array
          maxItems: 20
          items: { $ref: '#/components/schemas/SourceInput' }
      example:
        title: Housing affordability in San Diego
        description: What is driving housing costs, and which responses have evidence?
        location_label: San Diego, California
        partner_external_id: partner-housing-001
    TopicSource:
      type: object
      additionalProperties: true
      properties:
        source_id: { type: [string, integer] }
        topic_id: { type: string, format: uuid }
        source_type: { type: string, enum: [url, text, content] }
        source_url: { type: [string, 'null'], format: uri }
        source_text: { type: [string, 'null'] }
        content_id: { type: [integer, 'null'] }
    Job:
      type: object
      additionalProperties: false
      required: [job_id, status, progress, error, attempt_count, created_at, started_at, completed_at, updated_at]
      properties:
        job_id: { type: string, format: uuid }
        status: { type: string, enum: [queued, running, completed, failed] }
        progress:
          type: object
          additionalProperties: true
          required: [phase, percent]
          properties:
            phase: { type: string }
            percent: { type: number, minimum: 0, maximum: 100 }
        error:
          oneOf:
            - { type: 'null' }
            - type: object
              required: [code, message]
              properties:
                code: { type: string }
                message: { type: string }
        attempt_count: { type: integer, minimum: 0 }
        created_at: { type: [string, 'null'], format: date-time }
        started_at: { type: [string, 'null'], format: date-time }
        completed_at: { type: [string, 'null'], format: date-time }
        updated_at: { type: [string, 'null'], format: date-time }
        reused: { type: boolean }
        status_url: { type: string }
    Hypothesis:
      type: object
      additionalProperties: true
      required: [hypothesis_id, text, status]
      properties:
        hypothesis_id: { type: string }
        task_assertion_id: { type: [integer, 'null'] }
        text: { type: string }
        dimension_id: { type: [string, 'null'] }
        status: { type: string, enum: [proposed, accepted, rejected] }
    InquiryCase:
      type: object
      additionalProperties: true
      properties:
        framing_id: { type: string }
        status: { type: string }
        suggested_title: { type: [string, 'null'] }
        interpretation: { type: [string, 'null'] }
        research_dimensions: { type: array, items: { type: object, additionalProperties: true } }
        hypotheses: { type: array, items: { $ref: '#/components/schemas/Hypothesis' } }
        accepted_assertions: { type: array, items: { type: object, additionalProperties: true } }
        clarifying_questions: { type: array, items: { type: string } }
        evidence_runs: { type: array, items: { type: object, additionalProperties: true } }
        results: { type: object, additionalProperties: true }
    HypothesisDecision:
      type: object
      additionalProperties: false
      required: [hypothesis_id, accepted, text]
      properties:
        hypothesis_id: { type: string, minLength: 1, maxLength: 64 }
        accepted: { type: boolean }
        text: { type: string, minLength: 10, maxLength: 1000 }
    EvidenceSelection:
      type: object
      additionalProperties: false
      required: [hypothesis_id, text]
      properties:
        hypothesis_id: { type: string, minLength: 1, maxLength: 64 }
        text: { type: string, minLength: 10, maxLength: 1000 }
    SourceCrest:
      description: Source-reliability context, not proof that an argument is correct.
      type: [object, 'null']
      additionalProperties: true
      properties:
        admiraltyCode: { type: [string, 'null'] }
        publisherId: { type: [integer, 'null'] }
    EvidenceSource:
      type: [object, 'null']
      additionalProperties: true
      properties:
        source_id: { type: integer }
        title: { type: [string, 'null'] }
        url: { type: [string, 'null'], format: uri }
        media_source: { type: [string, 'null'] }
        publisher_id: { type: [integer, 'null'] }
        publisher_name: { type: [string, 'null'] }
        source_crest: { $ref: '#/components/schemas/SourceCrest' }
    EvidenceRelationship:
      type: object
      additionalProperties: true
      required: [relationship_id, stance]
      properties:
        relationship_id: { type: integer }
        task_assertion_id: { type: integer }
        reference_assertion_id: { type: integer }
        source_id: { type: integer }
        stance: { type: string, enum: [support, refute, nuance, insufficient] }
        support_level: { type: [number, 'null'] }
        confidence: { type: [number, 'null'] }
        rationale: { type: [string, 'null'] }
        quote: { type: [string, 'null'] }
        review_status: { type: string, enum: [proposed, approved, rejected] }
        created_by_ai: { type: boolean }
        source: { $ref: '#/components/schemas/EvidenceSource' }
        source_assertion: { type: [object, 'null'], additionalProperties: true }
        provenance: { type: [object, 'null'], additionalProperties: true }
        ranking:
          type: object
          additionalProperties: false
          properties:
            score: { type: number, minimum: 0, maximum: 1 }
            direct_bearing: { type: number, minimum: 0, maximum: 1 }
            source_reliability: { type: number, minimum: 0, maximum: 1 }
            source_crest_rated: { type: boolean }
            independence: { type: number, minimum: 0, maximum: 1 }
    EvidenceReview:
      type: object
      additionalProperties: false
      required: [topic_id, case_id, methodology, claims, summary]
      properties:
        topic_id: { type: string, format: uuid }
        case_id: { type: [integer, 'null'] }
        methodology: { type: object, additionalProperties: true }
        claims:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [claim_id, text, featured, reviewed, drawers, availability, counts]
            properties:
              claim_id: { type: integer }
              text: { type: string }
              featured:
                type: object
                additionalProperties:
                  type: array
                  items: { $ref: '#/components/schemas/EvidenceRelationship' }
              reviewed:
                type: object
                properties:
                  approved: { type: array, items: { $ref: '#/components/schemas/EvidenceRelationship' } }
                  rejected: { type: array, items: { $ref: '#/components/schemas/EvidenceRelationship' } }
              drawers: { type: object, additionalProperties: true }
              availability: { type: object, additionalProperties: true }
              counts: { type: object, additionalProperties: true }
        summary: { type: object, additionalProperties: { type: integer } }
    RelationshipReviewRequest:
      type: object
      additionalProperties: false
      required: [action]
      properties:
        action: { type: string, enum: [approve, correct_and_approve, reject] }
        changes:
          type: object
          additionalProperties: false
          properties:
            stance: { type: string, enum: [support, refute, nuance, insufficient] }
            support_level: { type: number }
            confidence: { type: number }
            rationale: { type: string }
            quote: { type: string }
        reason: { type: [string, 'null'] }
      examples:
        - { action: approve }
        - action: correct_and_approve
          changes: { stance: refute, rationale: The source challenges the exact period. }
        - { action: reject, reason: Does not address the exact claim. }
    PanelClaim:
      type: object
      additionalProperties: true
      required: [claim_id, text, review_status, publication_status]
      properties:
        claim_id: { type: [integer, string] }
        hypothesis_id: { type: [string, 'null'] }
        text: { type: string }
        kind: { type: string }
        review_status: { type: string }
        publication_status: { type: string }
        verimeter_score: { type: [integer, 'null'], minimum: -100, maximum: 100 }
        not_available_reason: { type: [string, 'null'] }
        source_coverage: { type: object, additionalProperties: { type: integer } }
        context_ids: { type: array, items: { type: string } }
    VeriMeter:
      type: object
      additionalProperties: true
      required: [method, topic_score, claim_coverage, scale]
      properties:
        method: { type: string }
        topic_score: { type: [integer, 'null'], minimum: -100, maximum: 100 }
        not_available_reason: { type: [string, 'null'] }
        claim_coverage:
          type: object
          required: [rated, eligible]
          properties:
            rated: { type: integer, minimum: 0 }
            eligible: { type: integer, minimum: 0 }
        scale:
          type: object
          properties:
            min: { type: integer, const: -100 }
            max: { type: integer, const: 100 }
    Panel:
      type: object
      additionalProperties: true
      required: [topic_id, title, snapshot_version, state, verimeter, claims, review, updated_at]
      properties:
        topic_id: { type: string, format: uuid }
        title: { type: string }
        description: { type: [string, 'null'] }
        location_label: { type: [string, 'null'] }
        snapshot_version: { type: integer }
        state: { $ref: '#/components/schemas/TopicState' }
        release: { type: object, additionalProperties: true }
        claim_counts: { type: object, additionalProperties: { type: integer } }
        contexts: { type: array, items: { type: object, additionalProperties: true } }
        verimeter: { $ref: '#/components/schemas/VeriMeter' }
        claims: { type: array, items: { $ref: '#/components/schemas/PanelClaim' } }
        evidence_groups: { type: object, additionalProperties: true }
        fact_cards: { type: array, items: { type: object, additionalProperties: true } }
        open_questions: { type: array, items: { type: string } }
        review: { type: object, additionalProperties: true }
        updated_at: { type: [string, 'null'], format: date-time }
    Release:
      type: object
      additionalProperties: false
      required: [release_id, topic_id, release_version, contract_version, methodology_version, content_hash, published_at]
      properties:
        release_id: { type: string, format: uuid }
        topic_id: { type: string, format: uuid }
        release_version: { type: integer, minimum: 1 }
        contract_version: { type: string }
        methodology_version: { type: string }
        content_hash: { type: string }
        published_at: { type: [string, 'null'], format: date-time }
        snapshot: { type: object, additionalProperties: true }
    ContributionRequest:
      type: object
      additionalProperties: false
      required: [type, text]
      properties:
        type: { type: string, enum: [claim, evidence] }
        stance: { type: [string, 'null'], enum: [support, refute, null] }
        target_claim_id: { type: [integer, 'null'], minimum: 1, description: Required for evidence. }
        text: { type: string, minLength: 10, maxLength: 4000 }
        source_url: { type: [string, 'null'], format: uri, maxLength: 2048 }
      example:
        type: evidence
        stance: support
        target_claim_id: 123
        text: Local permit records support the stated construction timeline.
        source_url: https://example.org/public-record
    Contribution:
      type: object
      additionalProperties: true
      properties:
        contribution_id: { type: string, format: uuid }
        topic_id: { type: string, format: uuid }
        contribution_type: { type: string, enum: [claim, evidence] }
        stance: { type: [string, 'null'], enum: [support, refute, null] }
        contribution_text: { type: string }
        target_claim_id: { type: [integer, 'null'] }
        source_url: { type: [string, 'null'], format: uri }
        status: { type: string, enum: [pending] }

paths:
  /topics:
    get:
      operationId: listTopics
      tags: [Topics]
      summary: Reference — List topics owned by the API-key account
      responses:
        '200':
          description: Topic list.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties: { data: { type: array, items: { $ref: '#/components/schemas/Topic' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/ServerError' }
    post:
      operationId: createTopic
      tags: [Topics]
      summary: Step 1 — Create a topic
      description: "`partner_external_id` makes creation idempotent for the key owner."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TopicCreateRequest' }
      responses:
        '201':
          description: Topic created.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: '#/components/schemas/Topic' }
                  meta: { type: object, properties: { idempotent_replay: { type: boolean } } }
        '200':
          description: Idempotent replay returned the existing topic.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: '#/components/schemas/Topic' }
                  meta: { type: object, properties: { idempotent_replay: { type: boolean } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /topics/{topicId}:
    get:
      operationId: getTopic
      tags: [Topics]
      summary: Reference — Read topic metadata, sources, and jobs
      parameters: [{ $ref: '#/components/parameters/TopicId' }]
      responses:
        '200':
          description: Topic detail.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    allOf:
                      - { $ref: '#/components/schemas/Topic' }
                      - type: object
                        properties:
                          sources: { type: array, items: { $ref: '#/components/schemas/TopicSource' } }
                          jobs: { type: array, items: { $ref: '#/components/schemas/Job' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /topics/{topicId}/sources:
    post:
      operationId: addTopicSource
      tags: [Topics]
      summary: Optional before Step 2 — Register a seed source
      description: Sources may be added only before preparation starts.
      parameters: [{ $ref: '#/components/parameters/TopicId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SourceInput' }
      responses:
        '201':
          description: Source registered.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties: { data: { $ref: '#/components/schemas/TopicSource' } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /topics/{topicId}/case:
    post:
      operationId: attachCanonicalCase
      tags: [Topics]
      summary: Optional fast path — Attach an existing canonical case
      description: Available before preparation; the case must contain task claims.
      parameters: [{ $ref: '#/components/parameters/TopicId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [case_id]
              properties: { case_id: { type: integer, minimum: 1 } }
            example: { case_id: 25281 }
      responses:
        '200':
          description: Case attached; data is the updated Topic.
          content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/Topic' } } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /topics/{topicId}/prepare:
    post:
      operationId: prepareTopic
      tags: [Preparation]
      summary: Step 2 — Prepare and frame the topic
      description: An active job is reused. Poll the returned `status_url`.
      parameters: [{ $ref: '#/components/parameters/TopicId' }]
      responses:
        '202':
          description: Job queued or reused.
          content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/Job' } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /topics/{topicId}/jobs/{jobId}:
    get:
      operationId: getPreparationJob
      tags: [Preparation]
      summary: Step 3 — Poll the preparation job
      parameters:
        - { $ref: '#/components/parameters/TopicId' }
        - { $ref: '#/components/parameters/JobId' }
      responses:
        '200':
          description: Current job state.
          content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/Job' } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /topics/{topicId}/review-workspace:
    get:
      operationId: getReviewWorkspace
      tags: [Preparation]
      summary: Step 4 — Read and select proposed claims
      parameters: [{ $ref: '#/components/parameters/TopicId' }]
      responses:
        '200':
          description: Topic, inquiry, seed sources, and jobs.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      topic: { $ref: '#/components/schemas/Topic' }
                      inquiry: { oneOf: [{ $ref: '#/components/schemas/InquiryCase' }, { type: 'null' }] }
                      sources: { type: array, items: { $ref: '#/components/schemas/TopicSource' } }
                      jobs: { type: array, items: { $ref: '#/components/schemas/Job' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /topics/{topicId}/review:
    post:
      operationId: reviewFramedClaims
      tags: [Preparation]
      summary: Alternative Step 5 — Decide every proposed claim
      description: Compatibility path; new clients may prefer `evidence-start`.
      parameters: [{ $ref: '#/components/parameters/TopicId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [decisions]
              properties: { decisions: { type: array, minItems: 1, items: { $ref: '#/components/schemas/HypothesisDecision' } } }
      responses:
        '200':
          description: Decisions applied; data is the InquiryCase.
          content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/InquiryCase' } } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /topics/{topicId}/evidence-start:
    post:
      operationId: startSelectedEvidence
      tags: [Evidence]
      summary: Step 5 — Accept selected claims and start evidence
      description: Unselected hypotheses remain proposed; existing runs are reused.
      parameters: [{ $ref: '#/components/parameters/TopicId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [selections]
              properties: { selections: { type: array, minItems: 1, items: { $ref: '#/components/schemas/EvidenceSelection' } } }
      responses:
        '202':
          description: Evidence queued or reused; data is the InquiryCase.
          content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/InquiryCase' } } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /topics/{topicId}/evidence-cancel:
    post:
      operationId: cancelTopicEvidence
      tags: [Evidence]
      summary: Cancel queued and running evidence collection
      description: Requests cooperative cancellation for the topic's active multi-claim evidence batch and immediately cancels work that has not started.
      parameters: [{ $ref: '#/components/parameters/TopicId' }]
      responses:
        '200':
          description: Cancellation recorded; data is the updated InquiryCase.
          content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/InquiryCase' } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /topics/{topicId}/evidence-review:
    get:
      operationId: getEvidenceReview
      tags: [Evidence]
      summary: Step 6 — Load balanced featured evidence
      description: Up to two support, two refute, and one qualifying item per claim; remaining items are in similarity drawers. Stances rank independently. SourceCrest is context, not proof.
      parameters: [{ $ref: '#/components/parameters/TopicId' }]
      responses:
        '200':
          description: Featured, reviewed, and grouped evidence.
          content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/EvidenceReview' } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /topics/{topicId}/evidence-relationships/{relationshipId}/review:
    post:
      operationId: reviewEvidenceRelationship
      tags: [Evidence]
      summary: Step 7 — Review a featured evidence relationship
      description: Only approved relationships influence a published VeriMeter.
      parameters:
        - { $ref: '#/components/parameters/TopicId' }
        - { $ref: '#/components/parameters/RelationshipId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RelationshipReviewRequest' }
      responses:
        '200':
          description: Review applied.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    additionalProperties: true
                    required: [relationship_id, review_status, idempotent]
                    properties:
                      relationship_id: { type: integer }
                      review_status: { type: string, enum: [approved, rejected] }
                      idempotent: { type: boolean }
                      claim_link_id: { type: integer }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/ServerError' }
  /topics/{topicId}/review-finish:
    post:
      operationId: finishEvidenceReview
      tags: [Publication]
      summary: Step 8 — Finish review and publish approved evidence
      description: Requires an approved relationship and no active evidence run. Unchanged publication is idempotent.
      parameters: [{ $ref: '#/components/parameters/TopicId' }]
      responses:
        '200':
          description: Topic published.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      topic: { $ref: '#/components/schemas/Topic' }
                      release: { $ref: '#/components/schemas/Release' }
                      idempotent: { type: boolean }
                      approved_relationships: { type: integer, minimum: 1 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /topics/{topicId}/releases:
    get:
      operationId: listTopicReleases
      tags: [Publication]
      summary: Reference — List immutable topic releases
      parameters: [{ $ref: '#/components/parameters/TopicId' }]
      responses:
        '200':
          description: Release metadata, newest first.
          content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/Release' } } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: publishTopicRelease
      tags: [Publication]
      summary: Alternative Step 8 — Publish the approved evidence release
      description: Lower-level alias for `review-finish`.
      parameters: [{ $ref: '#/components/parameters/TopicId' }]
      responses:
        '201':
          description: Release created or returned idempotently.
          content: { application/json: { schema: { type: object, properties: { data: { type: object, additionalProperties: true } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /topics/{topicId}/releases/{releaseId}:
    get:
      operationId: getTopicRelease
      tags: [Publication]
      summary: Reference — Read one immutable release
      description: Includes approved evidence, source links, provenance, SourceCrest, and VeriMeter coverage.
      parameters:
        - { $ref: '#/components/parameters/TopicId' }
        - { $ref: '#/components/parameters/ReleaseId' }
      responses:
        '200':
          description: Release with snapshot.
          content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/Release' } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /topics/{topicId}/panel:
    get:
      operationId: getTopicPanel
      tags: [Integration]
      summary: Step 9 — Load the frontend-neutral result
      description: Primary read model for partner interfaces after preparation or publication.
      parameters: [{ $ref: '#/components/parameters/TopicId' }]
      responses:
        '200':
          description: Panel snapshot.
          content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/Panel' } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /topics/{topicId}/claims:
    get:
      operationId: listTopicClaims
      tags: [Integration]
      summary: Optional result — List and filter claims
      parameters:
        - { $ref: '#/components/parameters/TopicId' }
        - { name: context, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        '200':
          description: Claim page.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      items: { type: array, items: { $ref: '#/components/schemas/PanelClaim' } }
                      pagination:
                        type: object
                        properties:
                          total: { type: integer }
                          limit: { type: integer }
                          offset: { type: integer }
                          has_more: { type: boolean }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /topics/{topicId}/verimeter:
    get:
      operationId: getTopicVeriMeter
      tags: [Integration]
      summary: Optional result — Read VeriMeter scores
      description: Topic score remains null before publication. Only approved evidence contributes.
      parameters: [{ $ref: '#/components/parameters/TopicId' }]
      responses:
        '200':
          description: VeriMeter and claim scores.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    allOf:
                      - { $ref: '#/components/schemas/VeriMeter' }
                      - type: object
                        properties:
                          topic_id: { type: string, format: uuid }
                          claims:
                            type: array
                            items:
                              type: object
                              properties:
                                claim_id: { type: [integer, string] }
                                score: { type: [integer, 'null'], minimum: -100, maximum: 100 }
                                not_available_reason: { type: [string, 'null'] }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /claims/{claimId}/evidence:
    get:
      operationId: getClaimEvidence
      tags: [Integration]
      summary: Optional result — Read one claim's approved evidence
      parameters: [{ $ref: '#/components/parameters/ClaimId' }]
      responses:
        '200':
          description: Approved evidence groups.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      topic_id: { type: string, format: uuid }
                      claim_id: { type: integer }
                      evidence_groups:
                        type: object
                        properties:
                          supporting: { type: array, items: { $ref: '#/components/schemas/EvidenceRelationship' } }
                          challenging: { type: array, items: { $ref: '#/components/schemas/EvidenceRelationship' } }
                          qualifying: { type: array, items: { $ref: '#/components/schemas/EvidenceRelationship' } }
                          insufficient: { type: array, items: { $ref: '#/components/schemas/EvidenceRelationship' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /topics/{topicId}/handoff:
    get:
      operationId: getTopicHandoff
      tags: [Integration]
      summary: Step 10 — Load the compact partner handoff
      parameters: [{ $ref: '#/components/parameters/TopicId' }]
      responses:
        '200':
          description: Facts and unresolved issues for the dialogue layer.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      topic_id: { type: string, format: uuid }
                      snapshot_version: { type: integer }
                      approved_facts: { type: array, items: { type: object, additionalProperties: true } }
                      unresolved_questions: { type: array, items: { type: string } }
                      predictive_issues: { type: array, items: { $ref: '#/components/schemas/PanelClaim' } }
                      value_issues: { type: array, items: { $ref: '#/components/schemas/PanelClaim' } }
                      evidence_refs: { type: array, items: {} }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /topics/{topicId}/contributions:
    post:
      operationId: createTopicContribution
      tags: [Discussion]
      summary: Step 11 — Submit discussion analysis for moderation
      description: Pending contributions do not affect a published VeriMeter.
      parameters: [{ $ref: '#/components/parameters/TopicId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ContributionRequest' }
      responses:
        '202':
          description: Contribution stored as pending.
          content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/Contribution' } } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
