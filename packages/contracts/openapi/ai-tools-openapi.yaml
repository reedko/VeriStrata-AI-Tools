openapi: 3.1.0
info:
  title: VeriStrata AI Tools API
  version: 0.2.0
  description: >-
    Authenticated integrity workflows backed by the VeriStrata Partner API.
    Diagnostic signals support human review and do not establish attribution,
    coordination, sponsorship, origin, or intent.
servers:
  - url: /api
paths:
  /health:
    get:
      operationId: getHealth
      security: []
      responses:
        '200': { description: Service is healthy }
  /tools:
    get:
      operationId: listTools
      security: []
      responses:
        '200': { description: Available workflow catalog }
  /tools/{toolName}/execute:
    post:
      operationId: executeTool
      parameters:
        - name: toolName
          in: path
          required: true
          schema: { type: string, enum: [document_screen, narrative_trace, corpus_assess] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/DocumentScreenInput'
                - $ref: '#/components/schemas/NarrativeTraceInput'
                - $ref: '#/components/schemas/CorpusAssessInput'
      responses:
        '200': { description: Structured workflow result }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { description: Rate or monthly quota exceeded }
  /evaluations/corpus-preflight:
    post:
      operationId: runCorpusPreflight
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [documents]
              properties:
                documents:
                  type: array
                  minItems: 2
                  maxItems: 20
                  items: { $ref: '#/components/schemas/CorpusDocument' }
      responses:
        '200': { description: Deterministic duplication and concentration signals }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /assessments/recent:
    get:
      operationId: listRecentAssessments
      responses:
        '200': { description: Recent assessments owned by the authenticated AI Tools client }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /assessments/{assessmentId}:
    get:
      operationId: getAssessmentReview
      parameters:
        - in: path
          name: assessmentId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Owned assessment with stored inputs/results and live evidence snapshot }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: Assessment not found for this client }
  /cases:
    post:
      operationId: createGuidedCase
      summary: Start a guided inquiry and prepare hypotheses
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [inquiry]
              properties:
                inquiry: { type: string, minLength: 10, maxLength: 1000 }
      responses:
        '201': { description: Owned case with preparation state }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /cases/{assessmentId}:
    get:
      operationId: getGuidedCase
      parameters:
        - { $ref: '#/components/parameters/AssessmentId' }
      responses:
        '200': { description: Current hypotheses, evidence review, panel, and VeriMeter state }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: Case not found for this client }
  /cases/{assessmentId}/evidence-start:
    post:
      operationId: startGuidedCaseEvidence
      parameters:
        - { $ref: '#/components/parameters/AssessmentId' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [selections]
              properties:
                selections:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [hypothesis_id, text]
                    properties:
                      hypothesis_id: { type: string }
                      text: { type: string }
      responses:
        '202': { description: Evidence collection queued }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /cases/{assessmentId}/evidence/{relationshipId}/review:
    post:
      operationId: reviewGuidedCaseEvidence
      parameters:
        - { $ref: '#/components/parameters/AssessmentId' }
        - in: path
          name: relationshipId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { type: string, enum: [approve, reject] }
                reason: { type: string }
      responses:
        '200': { description: Evidence decision applied and case refreshed }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /cases/{assessmentId}/finish:
    post:
      operationId: finishGuidedCase
      parameters:
        - { $ref: '#/components/parameters/AssessmentId' }
      responses:
        '200': { description: Review published with final panel and VeriMeter }
        '401': { $ref: '#/components/responses/Unauthorized' }
components:
  parameters:
    AssessmentId:
      in: path
      name: assessmentId
      required: true
      schema: { type: string, format: uuid }
  securitySchemes:
    aiToolsKey:
      type: http
      scheme: bearer
      bearerFormat: ait_...
      description: AI Tools client key. The underlying VeriStrata Partner key is never exposed.
  responses:
    Unauthorized:
      description: Missing, invalid, expired, or revoked AI Tools key
  schemas:
    DocumentScreenInput:
      type: object
      additionalProperties: false
      required: [focus, text]
      properties:
        focus: { type: string, minLength: 10, maxLength: 255 }
        title: { type: string, maxLength: 255 }
        text: { type: string, minLength: 10, maxLength: 5000 }
        wait_seconds: { type: integer, minimum: 0, maximum: 15, default: 10 }
    NarrativeTraceInput:
      type: object
      additionalProperties: false
      required: [assertion, source_texts]
      properties:
        assertion: { type: string, minLength: 10, maxLength: 255 }
        source_texts:
          type: array
          minItems: 1
          maxItems: 3
          items: { type: string, minLength: 10, maxLength: 5000 }
        geography: { type: string, maxLength: 255 }
        wait_seconds: { type: integer, minimum: 0, maximum: 15, default: 10 }
    CorpusAssessInput:
      type: object
      additionalProperties: false
      required: [documents]
      properties:
        focus: { type: string, minLength: 10, maxLength: 255 }
        title: { type: string, maxLength: 255 }
        documents:
          type: array
          minItems: 2
          maxItems: 5
          items: { $ref: '#/components/schemas/CorpusDocument' }
        wait_seconds: { type: integer, minimum: 0, maximum: 15, default: 10 }
    CorpusDocument:
      type: object
      required: [document_id, text]
      properties:
        document_id: { type: string, maxLength: 128 }
        title: { type: string, maxLength: 255 }
        text: { type: string, minLength: 10, maxLength: 5000 }
security:
  - aiToolsKey: []
